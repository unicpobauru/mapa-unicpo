# Cada lunes baja la hoja "Correcciones" de la planilla, regenera data/places.js y vuelve a publicar el mapa.
# También se puede ejecutar a mano: GitHub → pestaña Actions → "Actualización semanal del mapa" → Run workflow.
name: Actualización semanal del mapa

on:
  schedule:
    - cron: '0 11 * * 1'   # lunes 11:00 UTC = 08:00 en Bauru
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bajar correcciones de la planilla
        run: |
          API=$(grep -oE "https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec" config.js | head -1)
          if [ -z "$API" ]; then echo "config.js no tiene apiUrl"; exit 1; fi
          # Apps Script a veces responde una página HTML de error temporal: se reintenta hasta tener JSON válido.
          # Si nunca llega, no tocamos nada (mejor no publicar que publicar algo roto).
          ok=0
          for i in 1 2 3 4 5 6; do
            curl -sSL -A "Mozilla/5.0 (mapa-unicpo robot)" "$API?action=export&t=$(date +%s)" -o /tmp/corrections.json || true
            if node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/corrections.json','utf8')); if(!j.ok||!Array.isArray(j.corrections)) process.exit(1); console.log('correcciones recibidas:', j.corrections.length)" 2>/dev/null; then ok=1; break; fi
            echo "Intento $i: la planilla no respondió JSON. Respuesta:"
            head -c 400 /tmp/corrections.json | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' ' '; echo
            sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "No se pudo leer la planilla. No se publica nada esta vez."; exit 1; }
          node -e "const j=require('/tmp/corrections.json'); delete j.generated; require('fs').writeFileSync('data/corrections.json', JSON.stringify(j, null, 2)+'\n')"

      - name: Regenerar datos del mapa
        run: node data/build.mjs

      - name: Publicar si algo cambió
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "Sin cambios esta semana."
            exit 0
          fi
          # nuevo número de versión para que los celulares no usen la copia vieja
          sed -i -E "s/(data\/places\.js\?v=)[^\"]+/\1$(date -u +%Y%m%d%H%M)/" index.html
          git config user.name "Mapa UniCPO (robot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git commit -m "Actualización semanal desde la planilla ($(date -u +%Y-%m-%d))"
          git push
          # los push hechos con el token del robot no disparan GitHub Pages solos: se pide la publicación
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
